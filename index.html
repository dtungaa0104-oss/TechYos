<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТехЁс</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: confident, future-facing studio for a school — precise like an IDE, warm like a classroom.
   IDEA: a silicon chip under glass — the hero is a live die you turn; the curriculum reads like a docs site with paper you print.
   PICTURE: full-bleed night hero with a live 3D model on a glowing grid; bento tiles that move (typing, bits, quiz).
   COLOUR and TYPE: cobalt #2f45ff lead, coral #ff5b3a spark, mint for success; night #060a22 hero; Unbounded display, Onest text, JetBrains Mono for code.
   LAYOUT: sticky glass bar with scrolling nav + ⌘K search; hero; bento grid; docs layout (tree + paper) for programs. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#070a18);--ink:light-dark(#0b0e1a,#eef1ff);--mut:light-dark(#5b6275,#9aa3c7);
--sur:light-dark(#f3f5fb,#0f1430);--sur2:light-dark(#e8ecf8,#161c40);--line:light-dark(#e2e6f0,#20285a);
--pri:light-dark(#2f45ff,#7d8cff);--co:#ff5b3a;--mint:light-dark(#00a878,#2fe0a8);--night:#060a22;
--r:20px;--sh:0 1px 0 var(--line),0 18px 40px -18px light-dark(#1b2a8a33,#000c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Onest,"Noto Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Unbounded,Onest,sans-serif;line-height:1.08;text-wrap:balance;margin:0 0 .45em;letter-spacing:-.01em}
h1{font-size:clamp(32px,5vw,58px);font-weight:700}h2{font-size:clamp(24px,3vw,36px);font-weight:700}h3{font-size:18px;font-weight:600}
p{margin:0 0 .8em;max-width:68ch}a{color:var(--pri)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.band{padding:clamp(32px,5vw,72px) max(5vw,16px)}.wrap{max-width:1240px;margin:0 auto}
.mut{color:var(--mut)}.small{font-size:13.5px}
/* top bar */
header{position:sticky;top:0;z-index:30;background:light-dark(#ffffffd9,#070a18d9);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:10px max(4vw,16px);max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:700 15px Unbounded,sans-serif;color:var(--ink);text-decoration:none;flex:none}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;mask-image:linear-gradient(90deg,#000 92%,transparent)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--mut);text-decoration:none;padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:500;min-height:40px;display:inline-flex;align-items:center}
nav a:hover{color:var(--ink);background:var(--sur)}nav a[aria-current]{color:var(--ink);background:var(--sur2)}
.kbtn{flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--sur);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:8px 10px 8px 12px;min-height:42px;font:500 14px Onest,sans-serif;cursor:pointer}
.kbtn kbd{font:600 12px "JetBrains Mono",monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink)}
/* controls */
button,.btn{font:600 15px Onest,sans-serif;border-radius:12px;border:1px solid transparent;background:var(--pri);color:#fff;padding:11px 18px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .15s,background .15s}
button:hover,.btn:hover{transform:translateY(-1px)}
.ghost{background:var(--sur)!important;color:var(--ink)!important;border-color:var(--line)!important}
.co{background:var(--co)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--co);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,select,textarea{font:16px Onest,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-weight:600;font-size:14.5px;display:block;margin:10px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sur2);color:var(--ink)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.mt{color:var(--pri)}.tag.ie{color:var(--co)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{background:none;border:0;color:var(--mut);min-height:40px;padding:8px 14px;border-radius:10px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 0 var(--line),0 4px 12px -6px #0003}
.pins{display:flex;flex-wrap:wrap;gap:6px}
.pins button{width:46px;height:46px;padding:0;justify-content:center;font:700 15px "JetBrains Mono",monospace;background:var(--sur);color:var(--ink);border:1px solid var(--line);border-radius:12px;position:relative}
.pins button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 0 0 4px light-dark(#2f45ff22,#7d8cff33)}
/* hero */
.hero{background:var(--night);color:#eef1ff;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40px;z-index:-1;background:
 radial-gradient(60% 70% at 72% 40%,#2f45ff66,transparent 65%),radial-gradient(40% 40% at 10% 100%,#ff5b3a33,transparent 70%),
 linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/40px 40px;
 mask-image:radial-gradient(90% 90% at 60% 40%,#000 40%,transparent);animation:drift 30s linear infinite}
@keyframes drift{to{background-position:0 0,0 0,0 40px,40px 0}}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,3vw,40px);align-items:center}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#9fb0ff,#fff 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:#b9c2ec;font-size:18px}
.hero .btn{background:#fff;color:var(--night)}.hero .btn.alt{background:#ffffff14;color:#fff;border-color:#ffffff2e}
.hero .seg{background:#ffffff0f;border-color:#ffffff1f}.hero .seg button{color:#b9c2ec}.hero .seg button[aria-pressed=true]{background:#fff;color:var(--night)}
.term{font:500 14px "JetBrains Mono",monospace;color:#9fb0ff;margin:18px 0 0}
.term b{color:#2fe0a8;font-weight:500}.cur{display:inline-block;width:9px;height:1.05em;background:#2fe0a8;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}
.stats div{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:14px;padding:10px 12px}
.stats b{display:block;font:700 24px "JetBrains Mono",monospace;color:#fff}.stats span{font-size:12.5px;color:#9aa3c7}
.stage{position:relative;height:clamp(340px,46vw,540px);border-radius:28px;background:radial-gradient(80% 70% at 50% 35%,#1d2a8a,#0a1040 70%,#070b28);border:1px solid #ffffff1f;overflow:hidden;touch-action:none;box-shadow:0 40px 90px -30px #2f45ff88,inset 0 1px 0 #ffffff26}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;cursor:grab}
.stage .hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}.stage .hud>*{pointer-events:auto}
.chip{background:#0a1040cc;color:#eef1ff;border:1px solid #ffffff2a;border-radius:99px;padding:7px 13px;font:600 13px Onest,sans-serif;min-height:36px;cursor:pointer;backdrop-filter:blur(8px)}
.chip[aria-pressed=true]{background:#fff;color:var(--night)}
.info3d{position:absolute;top:12px;left:12px;max-width:min(320px,75%);background:#070b28d9;backdrop-filter:blur(10px);color:#dfe5ff;border-radius:16px;padding:12px 14px;font-size:14px;border:1px solid #ffffff26}
.info3d b{display:block;font:600 14.5px Unbounded,sans-serif;color:#fff;margin-bottom:4px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8ff;text-align:center;padding:20px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(180px,auto);gap:14px}
.tile{position:relative;background:var(--sur);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--pri)}
.tile h3{margin:0}.tile p{margin:0;color:var(--mut);font-size:14.5px}
.tile .go{margin-top:auto;font-weight:600;color:var(--pri);font-size:14.5px}
.b2{grid-column:span 2}.r2{grid-row:span 2}
.tile.dark{background:var(--night);color:#eef1ff;border-color:#1f2a66}.tile.dark p{color:#9aa3c7}.tile.dark .go{color:#9fb0ff}
.mini-tl{display:grid;gap:8px;margin:10px 0}
.mini-tl div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.mini-tl i{display:block;height:34px;border-radius:10px;background:linear-gradient(90deg,var(--pri),light-dark(#6b7bff,#5160ff));color:#fff;font-style:normal;font-size:13px;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tl div:nth-child(2) i{background:linear-gradient(90deg,#4c5cff,#7a86ff)}.mini-tl div:nth-child(3) i{background:linear-gradient(90deg,var(--co),#ff8a5c)}.mini-tl div:nth-child(4) i{background:linear-gradient(90deg,#00a878,#2fe0a8)}
.typer{font:500 20px "JetBrains Mono",monospace;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:58px}
.typer span{color:var(--mut)}
.bitrow{display:flex;gap:6px;margin:6px 0}.bitrow i{flex:1;aspect-ratio:1;border-radius:8px;background:#ffffff14;display:grid;place-items:center;font:700 13px "JetBrains Mono";font-style:normal;color:#9aa3c7;transition:background .3s}
.bitrow i.on{background:var(--co);color:#fff}
/* docs */
.docs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:6px}
.tree{margin-top:14px;display:grid;gap:2px}
.tree button{background:none;border:0;color:var(--ink);justify-content:flex-start;text-align:start;font-weight:500;padding:8px 10px;min-height:38px;border-radius:10px;font-size:14.5px;width:100%}
.tree button:hover{background:var(--sur);transform:none}
.tree button[aria-current]{background:var(--sur2);color:var(--pri)}
.tree .u{font-weight:700;margin-top:8px}.tree .u small{color:var(--mut);font-weight:500;margin-inline-start:auto;font-family:"JetBrains Mono",monospace}
.tree .l{padding-left:24px;color:var(--mut);font-size:14px}
.dbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:64px;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.crumb{font-size:14px;color:var(--mut)}.crumb b{color:var(--ink)}
.paper{background:#fff;color:#111;max-width:860px;margin:0 auto;padding:clamp(22px,5vw,56px);border-radius:8px;box-shadow:0 1px 0 #0000000f,0 30px 60px -30px #0b0e1a55;font:15px/1.6 Onest,Arial,sans-serif}
.paper h1{font:700 22px Onest,Arial,sans-serif;text-align:center;margin-bottom:16px;letter-spacing:0}
.paper h2{font:700 16px Onest,Arial,sans-serif;color:#1f2fbf;margin:20px 0 8px;letter-spacing:0}
.paper table{border-collapse:collapse;width:100%;margin:6px 0 10px}
.paper td,.paper th{border:1px solid #9aa0ad;padding:7px 9px;text-align:left;vertical-align:top;font-size:14px}
.paper th{background:#e8ecff}.paper .meta td:first-child{font-weight:700;width:30%;background:#f6f7fb}
.paper ul{margin:4px 0 10px;padding-left:22px}.paper p{white-space:pre-line;max-width:none}
.paper .ln{border-bottom:1px solid #999;height:28px}
.usel{display:flex;flex-direction:column;gap:4px;font-size:12.5px}.usel span{opacity:.75}.usel select{font:14px Onest,Arial,sans-serif;padding:9px 12px;border-radius:12px;border:1px solid var(--line,#ccd);background:var(--sur,#fff);color:inherit;max-width:min(92vw,460px)}
.wwc{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-width:820px}.wwc button{font-size:13.5px;padding:8px 13px;border-radius:999px}.wwc button.wrong{background:var(--co);color:#fff;opacity:.6}
.uapart{font:700 14px Onest,Arial,sans-serif;margin:16px 0 8px;color:#1f2fbf}.mcq{border:0;padding:0;margin:0}.mcq legend{font-weight:600;margin-bottom:6px}.mcq label{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;cursor:pointer}
.uagh .cnt{display:inline-flex;align-items:center;gap:6px;margin-left:6px}.uagh .cnt b{font-size:12.5px;min-width:34px;text-align:center}
.lvtag{display:inline-block;font:600 11.5px 'JetBrains Mono',monospace;color:#1f2fbf;background:light-dark(#e8ecff,#1a2150);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.exam input{font:15px Onest,Arial,sans-serif;padding:9px 12px;border-radius:12px;border:1px solid var(--line,#ccd);background:var(--sur,#fff);color:inherit}
.alay{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.alay{grid-template-columns:1fr}}
.asb{display:grid;gap:14px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}@media(max-width:900px){.asb{position:static;max-height:none}}
.acard{background:var(--sur,#fff);border:1px solid var(--line,#dde);border-radius:16px;padding:16px}.acard h3{font:700 16px Onest,Arial,sans-serif;margin:0 0 6px}.acard .mut{font-size:13px;margin:0 0 8px;opacity:.75}
.acard .usel select{width:100%;max-width:none}
.csg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0 12px}.cs{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}.cs small{display:block;font-weight:400;opacity:.7}
.cs select{font:600 15px Onest,Arial,sans-serif;padding:8px 10px;border-radius:10px;border:1px solid var(--line,#ccd);background:var(--sur,#fff);color:inherit}
button.wide,.btn.wide{width:100%;justify-content:center}.adet{border-top:1px solid var(--line,#dde);margin-top:12px;padding-top:10px}.adet summary{cursor:pointer;font-weight:700;font-size:13.5px;color:light-dark(#1f7a55,#5fd3a2)}
.adet .uap{border:0;padding:8px 0 0;background:none;margin:0}.adet .uap .uah{display:none}
.codei{width:100%;font:12.5px 'JetBrains Mono',monospace;padding:9px 10px;border-radius:10px;border:1px solid var(--line,#ccd);background:var(--bg,#f6f7fb);color:inherit}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:8px 0}.chk input[type=number]{padding:6px 8px;border-radius:8px;border:1px solid var(--line,#ccd)}
.qrbox{display:flex;justify-content:center;margin:12px 0 8px}.qrbox svg{width:170px;height:170px;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line,#dde)}.qrbig svg{width:min(70vh,80vw);height:auto;display:block;margin:10px auto;background:#fff}
.amain,.gridbg{background-color:light-dark(#f4f7fb,#0e1226);background-image:linear-gradient(light-dark(#e3e9f3,#1a2040) 1px,transparent 1px),linear-gradient(90deg,light-dark(#e3e9f3,#1a2040) 1px,transparent 1px);background-size:24px 24px}
.amain{border-radius:18px;padding:clamp(10px,2.5vw,28px)}
.sheet{background:#fff;color:#111;border-radius:12px;box-shadow:0 1px 0 #0000000f,0 20px 50px -30px #0b0e1a66;padding:clamp(18px,4vw,44px);font:15px/1.55 Onest,Arial,sans-serif;max-width:900px;margin:0 auto}
.shead{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px solid #1f2fbf;padding-bottom:12px;margin-bottom:10px}.shead b{display:block;font:700 20px Onest,Arial,sans-serif}.shead span{font-size:13.5px;color:#555}
.stot{text-align:center;background:#1f2fbf;color:#fff;border-radius:12px;padding:6px 14px;min-width:70px}.stot b{font-size:20px}.stot span{color:#dfe3ff;font-size:11.5px}
.sinfo{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;color:#333;margin:8px 0 6px}
.spart{font:700 15px Onest,Arial,sans-serif;color:#1f2fbf;margin:22px 0 4px;padding-top:12px;border-top:1px dashed #c9cfe0}.spart small{font-weight:500;color:#666;margin-left:6px}
.ql{list-style:none;margin:0;padding:0}.qi{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eceff5}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:#16233f;color:#fff;font:700 13px Onest,Arial,sans-serif;display:grid;place-items:center;margin-top:1px}
.qb{flex:1;min-width:0}.qt{margin:2px 0 10px;font-size:15.5px;color:#111;display:block;font-weight:500}
.opts4{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.op{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid #cfd5e3;border-radius:8px;padding:9px 12px;background:#fff;color:#111;font:14.5px/1.35 Onest,Arial,sans-serif;min-height:44px;width:100%}
button.op{cursor:pointer}button.op:hover:not(:disabled){border-color:#1f2fbf;background:#f5f7ff}button.op:disabled{opacity:1;cursor:default}
.ol{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #16233f;display:grid;place-items:center;font:700 12px Onest,Arial,sans-serif}
.op.on{border-color:#1f2fbf;background:#eef1ff;box-shadow:inset 0 0 0 1px #1f2fbf}.op.on .ol{background:#1f2fbf;color:#fff;border-color:#1f2fbf}
.op.ok{border-color:#1b9e6b;background:#e9f9f1}.op.ok .ol{background:#1b9e6b;color:#fff;border-color:#1b9e6b}.op.bad{border-color:#e0533d;background:#fdeeea}.op.bad .ol{background:#e0533d;color:#fff;border-color:#e0533d}
.ctx{white-space:pre-line;background:#f6f8fc;border:1px solid #dfe5f0;border-left:4px solid #1f2fbf;border-radius:8px;padding:10px 12px;font-size:14.5px;margin:2px 0 10px;font-family:Onest,Arial,sans-serif}.qt.sub{margin:12px 0 6px}.opts5{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.spsub{font-size:13px;color:#555;margin:4px 0 0}.qt{white-space:pre-line}
.qmeta{display:block;font-size:12px;color:#777;margin-top:8px}.qmeta .lvtag{margin:0 6px 0 0}
.hint{margin-top:10px;background:#fff8dc;color:#7a5a00;border:1px dashed #e6c35a;border-radius:999px;padding:4px 12px;min-height:0;font:600 12.5px Onest,Arial,sans-serif}.hintx{display:block;margin-top:8px;font-size:13px;background:#fff8dc;border-radius:8px;padding:8px 10px;color:#5d4500}
.ansl{background:repeating-linear-gradient(transparent 0 25px,#c9cfdd 25px 26px);margin:4px 0}
.sheet textarea{width:100%;font:15px/1.5 Onest,Arial,sans-serif;border:1px solid #cfd5e3;border-radius:8px;padding:10px;background:repeating-linear-gradient(#fff 0 26px,#eef1f7 26px 27px);color:#111}
.sheet input{font:15px Onest,Arial,sans-serif;padding:9px 12px;border-radius:10px;border:1px solid #cfd5e3;background:#fff;color:#111}.sheet .usel span{color:#555}
.srub{margin-top:18px;font-size:13.5px;color:#111}.srub table{border-collapse:collapse;width:100%}.srub td,.srub th{border:1px solid #c9cfdd;padding:7px 9px;text-align:left;vertical-align:top;white-space:pre-line}.srub th{background:#eef1ff}
.uap{max-width:860px;margin:0 auto 16px;border:1px solid var(--line,#ccd);border-radius:16px;padding:16px 18px;background:light-dark(#f7f8ff,#141833)}
.uah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.uah h3{font:700 16px Onest,Arial,sans-serif;margin:0}.uac{font:600 13px 'JetBrains Mono',monospace;color:var(--accent,#3b4bff)}
.ual{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.ual>span{font-size:13px;opacity:.8}
.uap .chip{border-radius:999px;padding:6px 12px;font-size:13px;border:1px solid var(--line,#ccd);background:transparent;color:inherit;cursor:pointer}.uap .chip[aria-pressed=true]{background:#1f2fbf;color:#fff;border-color:#1f2fbf}.uap .chip small{opacity:.7;margin-left:4px}
.uat{max-height:420px;overflow:auto;display:grid;gap:12px;padding-right:4px}.uagh{font-weight:700;font-size:13.5px;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.uagh small{font-weight:400;opacity:.7}
.uap .sm{padding:2px 9px;font-size:12px;border-radius:999px}
.uai{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 8px;color:inherit;font:14px/1.45 Onest,Arial,sans-serif;cursor:pointer}.uai:hover{border-color:var(--line,#ccd)}
.uai small{display:block;font-size:12px;opacity:.65;margin-top:2px}.uai .bx{flex:none;width:18px;height:18px;border:2px solid #1f2fbf;border-radius:5px;margin-top:2px}.uai[aria-pressed=true] .bx{background:#1f2fbf;box-shadow:inset 0 0 0 3px light-dark(#f7f8ff,#141833)}
.uap .mut{font-size:12.5px;opacity:.7;margin:10px 0 0}

.flag{display:flex;gap:10px;align-items:flex-start;background:light-dark(#fff4ef,#2a1612);border:1px solid light-dark(#ffd2c4,#5a2a20);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px;max-width:860px;margin-inline:auto}
.flag.ok{background:light-dark(#ecfbf4,#0d2a20);border-color:light-dark(#b9eed6,#1f5a43)}.flag.ok::before{background:var(--mint)}
.tch{font:700 12.5px Onest,sans-serif;text-transform:none;color:var(--co);margin:16px 10px 2px}.tsub{font-weight:700;font-size:13.5px;color:var(--mut);margin:10px 10px 2px}
.tree button small{color:var(--mut);font-weight:500;margin-inline-start:auto;font-family:"JetBrains Mono",monospace;font-size:12px}
.flag::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--co)}
/* quiz, games */
.q{font-size:20px;font-weight:600;margin:12px 0 14px}
.opts{display:grid;gap:8px}
.opts button{background:var(--bg);color:var(--ink);border:1px solid var(--line);justify-content:flex-start;text-align:start;font-weight:500}
.opts button.right{border-color:var(--mint);background:light-dark(#e3f8f0,#0e3326)}.opts button.wrong{border-color:var(--co);background:light-dark(#fff0eb,#3a1810)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px;align-items:center;margin:6px 0}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:640px}
.mem button{min-height:92px;justify-content:center;text-align:center;font-size:14px;background:var(--night);color:transparent;border:1px solid #1f2a66}
.mem button.up{background:var(--sur);color:var(--ink);border-color:var(--line)}.mem button.done{background:light-dark(#e3f8f0,#0e3326);color:var(--ink);border-color:var(--mint)}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;max-width:640px}
.bits button{flex-direction:column;justify-content:center;font:700 24px "JetBrains Mono",monospace;background:var(--sur);color:var(--ink);border:1px solid var(--line);padding:8px 0;min-height:78px}
.bits button small{font:500 12px Onest;color:var(--mut)}
.bits button[aria-pressed=true]{background:var(--co);border-color:var(--co);color:#fff}.bits button[aria-pressed=true] small{color:#fff}
.big{font:700 clamp(36px,6vw,60px) "JetBrains Mono",monospace;color:var(--pri);line-height:1}
.note{border-left:3px solid var(--co);background:var(--sur);padding:10px 14px;border-radius:0 12px 12px 0;font-size:14.5px}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:16px}
.ws li{margin:12px 0}.ws textarea{min-height:60px}
.secthead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.secthead p{margin:0}
/* modal, palette, toast */
.modal{position:fixed;inset:0;z-index:50;background:#030616b3;backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.modal.open{display:flex}
.sheet{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:24px;max-width:820px;width:100%;padding:clamp(18px,3vw,32px);position:relative;box-shadow:0 30px 80px #0009}
.sheet .x{position:absolute;top:12px;right:12px;width:44px;padding:0;justify-content:center}
.pal{max-width:640px;padding:0;overflow:hidden}
.pal input{border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:18px;padding:18px 20px;min-height:60px;background:transparent}
.pal input:focus-visible{outline:none}
.pal ul{list-style:none;margin:0;padding:8px;max-height:min(60vh,460px);overflow:auto}
.pal li button{width:100%;background:none;border:0;color:var(--ink);justify-content:flex-start;text-align:start;font-weight:500;padding:10px 12px;border-radius:10px;min-height:46px;transform:none}
.pal li button small{margin-inline-start:auto;color:var(--mut);font-weight:500;white-space:nowrap}
.pal li button.sel{background:var(--sur2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 18px;border-radius:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;border:1px solid #1f2a66}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
#printArea{display:none}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block}body.printing .paper{box-shadow:none;padding:0;max-width:none}}
table.plain{border-collapse:collapse;width:100%}table.plain th,table.plain td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
/* typing */
.tlessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px;margin-bottom:18px}
.tlessons button{flex-direction:column;align-items:flex-start;gap:2px;background:var(--sur);color:var(--ink);border-color:var(--line);text-align:start}
.tlessons button small{font-weight:400;color:var(--mut);font-size:13px}
.tlessons button[aria-pressed=true]{border-color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}
.tstats{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;margin-bottom:12px;font-size:14.5px}
.tstats b{font:700 22px "JetBrains Mono",monospace;color:var(--pri);margin-inline-start:6px}
.tbox{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px;font:500 clamp(19px,2.4vw,26px)/1.7 "JetBrains Mono","Noto Sans Mono",ui-monospace,monospace;min-height:130px;word-break:break-word}
.tbox:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px light-dark(#2f45ff1a,#7d8cff26)}
.tbox:not(:focus-within)::after{content:"Энд дарж эхэлнэ үү";position:absolute;inset:0;display:grid;place-items:center;background:light-dark(#ffffffd9,#070a18d9);border-radius:15px;font:600 18px Onest,sans-serif;color:var(--pri)}
.tbox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;cursor:text;border:0}
#ttext span.d{color:var(--mut)}#ttext span.x{color:var(--co);text-decoration:underline}
#ttext span.c{background:var(--pri);color:#fff;border-radius:4px}
.thint{margin:10px 0 14px;font-size:15px;min-height:24px}
.kb{display:flex;flex-direction:column;gap:5px;max-width:880px;margin:0 auto;user-select:none}
.kr{display:flex;gap:5px}
.k{flex:1 1 0;height:46px;border-radius:9px;display:grid;place-items:center;font:600 15px Onest,sans-serif;background:var(--fc,var(--sur));border:1px solid var(--line);color:var(--ink);position:relative;transition:transform .08s}
.k small{font-size:11px;color:var(--mut);font-weight:500}
.k.home::after{content:"";position:absolute;bottom:6px;width:12px;height:2px;border-radius:2px;background:currentColor;opacity:.6}
.k.next{outline:3px solid var(--pri);outline-offset:1px;transform:translateY(-2px);z-index:1}
.k.bad{background:var(--co);color:#fff}
.f1{--fc:light-dark(#ffe0d8,#3d1d16)}.f2{--fc:light-dark(#fff0c2,#3a3014)}.f3{--fc:light-dark(#d4f5e8,#103326)}.f4{--fc:light-dark(#dde3ff,#1a2260)}.f5{--fc:light-dark(#eceef4,#1f2647)}
.legend{gap:8px 16px;margin-top:12px;justify-content:center}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:16px;height:16px;border-radius:5px;background:var(--fc);border:1px solid var(--line)}
[hidden]{display:none!important}
@media(max-width:980px){.docs{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}.dbar{top:60px}}
@media(max-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.kbtn span{display:none}}
@media(max-width:600px){.bento{grid-template-columns:minmax(0,1fr)}.b2{grid-column:auto}.r2{grid-row:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .mem{grid-template-columns:repeat(3,minmax(0,1fr))}.bits button{font-size:18px;min-height:64px}.k{height:36px;font-size:12px;border-radius:6px}.kr,.kb{gap:3px}.k small{display:none}
.paper td,.paper th{font-size:12.5px;padding:5px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* blocks: h1 | h2 | p | meta(rows) | table(head,rows,w) | list(items) | lines(n) */
function blocksHTML(B){return B.map(b=>{
 if(b.t==='h1')return `<h1>${esc(b.x)}</h1>`;if(b.t==='h2')return `<h2>${esc(b.x)}</h2>`;if(b.t==='p')return `<p>${esc(b.x)}</p>`;
 if(b.t==='meta')return `<table class="meta">${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
 if(b.t==='table')return `<table><thead><tr>${b.head.map((h,i)=>`<th style="width:${b.w?b.w[i]/50:''}%">${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td style="white-space:pre-line">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 if(b.t==='list')return `<ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
 if(b.t==='lines')return '<div class="ln"></div>'.repeat(b.n||2);if(b.t==='web')return webSVG(b);return ''}).join('')}

function tStats(){
 const sec=TL.t0?(Date.now()-TL.t0)/1000:0,wpm=sec>2?Math.round(TL.i/5/(sec/60)):0,acc=TL.i+TL.err?Math.round(TL.i/(TL.i+TL.err)*100):100;

 if(!$('#tw'))clearInterval(TL.iv);return{wpm,acc,sec};
}
function tType(ch,code){
 if(TL.done||!TL.text)return;
 if(!TL.t0){TL.t0=Date.now();TL.iv=setInterval(tStats,500)}
 const exp=TL.text[TL.i];
 if(ch===exp){const s=$('#tc'+TL.i);s?.classList.add(TL.errs.has(TL.i)?'x':'d');TL.i++}
 else{TL.err++;TL.errs.add(TL.i);const k=code&&$('#k_'+code)||(keyFor(ch)&&$('#k_'+keyFor(ch).c));if(k){k.classList.add('bad');setTimeout(()=>k.classList.remove('bad'),220)}}
 tMark();const st=tStats();
 if(TL.i>=TL.text.length){TL.done=true;clearInterval(TL.iv);tFinish(st)}
}

function tResolve(e){
 const exp=TL.text[TL.i],M=KMAP(),v=M[e.code];let mapped=null;
 if(v){const letter=v[0].toUpperCase()!==v[0];const caps=e.getModifierState&&e.getModifierState('CapsLock');mapped=v[(letter?e.shiftKey!==caps:e.shiftKey)?1:0]}
 if(e.key===exp||mapped===exp)return exp;
 return TL.lang==='mn'&&/[а-яёөү]/i.test(e.key)?e.key:(mapped||e.key);
}
function initTyping(){

  if(e.key.length!==1)return;e.preventDefault();tType(tResolve(e),e.code)});

}

let PIDX=null,psel=0,pres=[];
function buildIndex(){const a=VIEWS.map(([k,n])=>({t:n,sub:'Хэсэг',go:()=>location.hash=k}));
 for(const s of ['ie','mt'])for(let g=6;g<=12;g++){const st=STRUCT(s,g);if(!st)continue;a.push({t:`${g}-р анги жилийн төлөвлөгөө`,sub:SUBJ[s],go:()=>openDoc(s,g,{type:'year',u:0,l:0})});let n=0;
  st.units.forEach((u,ui)=>{a.push({t:u.name,sub:`${SHORT[s]} ${g}-р анги · нэгж хичээл`,go:()=>openDoc(s,g,{type:'unit',u:ui,l:0})});u.lessons.forEach((l,li)=>{n++;a.push({t:l.t,sub:`${SHORT[s]} ${g}-р анги · ${n}-р хичээл`,go:()=>openDoc(s,g,{type:'lesson',u:ui,l:li})})})})}
 WS.forEach(w=>a.push({t:w.t,sub:`${w.kind} · ${w.g}-р анги`,go:()=>{location.hash='materials';setTimeout(()=>openWS(w.id),50)}}));
 CASES.forEach(c=>a.push({t:c.t,sub:'Кэйс',go:()=>{location.hash='cases';setTimeout(()=>openCase(c.id),50)}}));
 TLES.forEach(l=>a.push({t:l.t,sub:'Шивэх дасгал',go:()=>{TL.lang=l.lang;TL.id=l.id;location.hash='typing';render()}}));return a}
function openDoc(s,g,doc){S.subj=s;S.grade=g;S.doc=doc;save();if(location.hash!=='#program')location.hash='program';else render()}
function openPal(){PIDX=PIDX||buildIndex();$('#palette').classList.add('open');const q=$('#pq');q.value='';palFilter();q.focus()}
function palFilter(){const v=$('#pq').value.trim().toLowerCase(),words=v.split(/\s+/).filter(Boolean);
 pres=(words.length?PIDX.filter(x=>{const h=(x.t+' '+x.sub).toLowerCase();return words.every(w=>h.includes(w))}):PIDX.slice(0,9)).slice(0,40);psel=0;palDraw()}
function palDraw(){$('#pl').innerHTML=pres.length?pres.map((x,i)=>`<li><button data-pi="${i}" class="${i===psel?'sel':''}" role="option" aria-selected="${i===psel}">${esc(x.t)}<small>${esc(x.sub)}</small></button></li>`).join(''):'<li class="empty" style="margin:8px">Илэрц олдсонгүй</li>';
 $('#pl .sel')?.scrollIntoView({block:'nearest'})}
$('#pq').addEventListener('input',palFilter);
$('#pq').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();psel=Math.min(pres.length-1,psel+1);palDraw()}else if(e.key==='ArrowUp'){e.preventDefault();psel=Math.max(0,psel-1);palDraw()}else if(e.key==='Enter'&&pres[psel]){e.preventDefault();const x=pres[psel];closeModal();x.go()}});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}else if(e.key==='Escape')closeModal()});

const MODELS=[
{name:'Компьютерийн дотор',parts:[['Эх хавтан','Бүх эд ангийг холбох үндсэн хавтан.',0x0f8a64,[6,.2,4.4],[0,0,0]],['Төв процессор (CPU)','Командыг гүйцэтгэх «тархи». Секундэд тэрбум үйлдэл хийнэ.',0xd5d9e4,[1.1,.25,1.1],[-1,.25,-.5]],['Сэнс','Процессорыг хөргөнө.',0x2a3150,'fan',[-1,.75,-.5]],['Шуурхай санах ой (RAM)','Ажиллаж буй програмын түр санах ой. Тэжээл тасрахад арилна.',0x2f45ff,[.18,1,2.2],[.6,.6,-.6]],['RAM 2','Хоёр дахь санах ойн самбар.',0x2f45ff,[.18,1,2.2],[.95,.6,-.6]],['Видео карт (GPU)','Зураг, видео, 3D дүрслэлийг боловсруулна.',0xff5b3a,[3.4,.5,1.1],[-.6,.45,1.3]],['SSD хадгалах төхөөрөмж','Файл, програмыг удаан хугацаанд хадгална.',0xffc83a,[1.2,.12,.5],[2,.2,1.4]],['Тэжээлийн блок','Цахилгааныг компьютерт тохирох хүчдэл болгон хувиргана.',0x5a6280,[1.6,1.1,1.4],[2.1,.7,-1.3]]]},
{name:'Сүлжээний топологи',net:true,parts:[]},
{name:'Төрийн гурван салаа',parts:[['Ард түмэн','Монгол Улсад төрийн бүх эрх ард түмний мэдэлд байна (Үндсэн хууль).',0xe9edf5,[6.4,.4,3.2],[0,0,0]],['Улсын Их Хурал','Хууль тогтоох эрх мэдэл. 126 гишүүнтэй, хуулиа батална.',0x2f45ff,'col',[-2.2,1.6,0]],['Засгийн газар','Гүйцэтгэх эрх мэдэл. Хуулийг хэрэгжүүлж, төрийн ажлыг удирдана.',0xff5b3a,'col',[0,1.6,0]],['Шүүх','Шүүх эрх мэдэл. Маргааныг хуулийн дагуу хараат бусаар шийднэ.',0x00c08b,'col',[2.2,1.6,0]],['Үндсэн хууль','Улсын дээд хууль — гурван салааг нэг дор барина.',0xffffff,'roof',[0,3.55,0]]]}];
const NETS={'Од':'star','Цагираг':'ring','Бүрэн холбоот':'mesh','Шугам':'bus'};
const G3={ok:!!window.THREE,model:0,net:'star',rx:.55,ry:.6,zoom:11,auto:!reduce,sel:null,meshes:[]};
if(G3.ok){try{
 const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(2,devicePixelRatio));G3.R=R;
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1,.1,100);G3.sc=sc;G3.cam=cam;
 sc.add(new THREE.HemisphereLight(0xe6ebff,0x141c4a,1.05));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,8,6);sc.add(dl);const rim=new THREE.DirectionalLight(0x6f80ff,.5);rim.position.set(-6,2,-6);sc.add(rim);
 G3.root=new THREE.Group();sc.add(G3.root);G3.ray=new THREE.Raycaster();
 const el=R.domElement;let drag=null,moved=0;
 el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;G3.auto=false;el.setPointerCapture(e.pointerId)});
 el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);G3.ry+=dx*.01;G3.rx=Math.max(-.4,Math.min(1.35,G3.rx+dy*.01));drag={x:e.clientX,y:e.clientY}});
 el.addEventListener('pointerup',e=>{if(drag&&moved<6)pick(e);drag=null});
 el.addEventListener('wheel',e=>{e.preventDefault();G3.zoom=Math.max(6,Math.min(18,G3.zoom+e.deltaY*.01))},{passive:false});
 const loop=()=>{requestAnimationFrame(loop);if(!G3.host||!G3.host.isConnected)return;if(G3.auto)G3.ry+=.003;
  G3.root.rotation.set(G3.rx,G3.ry,0);cam.position.set(0,0,G3.zoom);cam.lookAt(0,0,0);if(G3.fan)G3.fan.rotation.y+=.15;R.render(sc,cam)};loop();
 new ResizeObserver(()=>size3D()).observe(document.body);
}catch(e){G3.ok=false}}
function size3D(){if(!G3.ok||!G3.host)return;const w=G3.host.clientWidth,h=G3.host.clientHeight;if(!w||!h)return;G3.R.setSize(w,h,false);G3.cam.aspect=w/h;G3.cam.updateProjectionMatrix()}
function build3D(){
 if(!G3.ok)return;const T=THREE,root=G3.root;while(root.children.length)root.remove(root.children[0]);G3.fan=null;G3.meshes=[];G3.sel=null;
 const grid=new T.GridHelper(16,32,0x4b5dff,0x1c2766);grid.position.y=-.35;root.add(grid);
 const M=MODELS[G3.model];
 const add=(geo,col,pos,name,info)=>{const m=new T.Mesh(geo,new T.MeshStandardMaterial({color:col,roughness:.45,metalness:.2}));m.position.set(...pos);m.userData={name,info};root.add(m);G3.meshes.push(m);return m};
 if(M.net){const N=6,pts=[],typ=G3.net;
  if(typ==='star'){pts.push([0,0,0]);for(let i=0;i<N;i++){const a=i/N*Math.PI*2;pts.push([Math.cos(a)*3.2,Math.sin(a*2)*.5,Math.sin(a)*3.2])}}
  else if(typ==='bus'){for(let i=0;i<N;i++)pts.push([-4+i*1.6,i%2?1:-1,0])}else for(let i=0;i<N;i++){const a=i/N*Math.PI*2;pts.push([Math.cos(a)*3,0,Math.sin(a)*3])}
  pts.forEach((p,i)=>{const hub=typ==='star'&&i===0;add(hub?new T.BoxGeometry(1.2,.6,1.2):new T.SphereGeometry(.45,32,20),hub?0xffc83a:i%2?0x7d8cff:0xff5b3a,p,hub?'Свич (төв төхөөрөмж)':`Компьютер ${typ==='star'?i:i+1}`,hub?'Од топологид бүх төхөөрөмж төвөөр дамжиж холбогдоно. Төв эвдэрвэл сүлжээ тасарна.':'Сүлжээний зангилаа (хост). IP хаягаар танигдана.')});
  const ln=[],L=(a,b)=>ln.push(new T.Vector3(...pts[a]),new T.Vector3(...pts[b]));
  if(typ==='star')for(let i=1;i<pts.length;i++)L(0,i);if(typ==='ring')for(let i=0;i<N;i++)L(i,(i+1)%N);if(typ==='mesh')for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)L(i,j);
  if(typ==='bus'){ln.push(new T.Vector3(-4.6,0,0),new T.Vector3(4.6,0,0));pts.forEach(p=>ln.push(new T.Vector3(p[0],0,0),new T.Vector3(...p)))}
  root.add(new T.LineSegments(new T.BufferGeometry().setFromPoints(ln),new T.LineBasicMaterial({color:0xffffff})));
 }else M.parts.forEach(([n,info,col,g,pos])=>{let geo;
  if(g==='fan')geo=new T.CylinderGeometry(.5,.5,.25,32);else if(g==='col')geo=new T.CylinderGeometry(.55,.65,2.8,32);else if(g==='roof')geo=new T.CylinderGeometry(.01,3.9,1.3,4,1);else geo=new T.BoxGeometry(...g);
  const m=add(geo,col,pos,n,info);if(g==='fan')G3.fan=m;if(g==='roof')m.rotation.y=Math.PI/4});
 info3D(null);parts3D();
}
function pick(e){const r=G3.R.domElement.getBoundingClientRect();const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);G3.ray.setFromCamera(v,G3.cam);const hit=G3.ray.intersectObjects(G3.meshes)[0];select(hit?hit.object:null)}
function select(m){G3.meshes.forEach(x=>{x.material.emissive.setHex(0);x.scale.set(1,1,1)});G3.sel=m;if(m){m.material.emissive.setHex(0x2a2a10);m.scale.set(1.08,1.08,1.08)}info3D(m)}
function info3D(m){const h=G3.host&&G3.host.querySelector('.info3d');if(!h)return;const M=MODELS[G3.model];
 h.innerHTML=m?`<b>${esc(m.userData.name)}</b>${esc(m.userData.info)}`:`<b>${esc(M.name)}</b>${M.net?'Топологи сонгоод, зангилаа дээр дарна уу.':'Хэсэг дээр дарж тайлбарыг уншина уу.'}`}
function parts3D(){const el=$('#labParts');if(!el||!G3.ok)return;
 el.innerHTML=G3.meshes.filter((m,i,a)=>a.findIndex(x=>x.userData.name===m.userData.name)===i).map(m=>`<button class="card" style="color:var(--ink);text-align:start;flex-direction:column;align-items:flex-start;font-weight:400" data-part="${G3.meshes.indexOf(m)}"><b style="color:var(--pri);font-weight:600">${esc(m.userData.name)}</b><span class="small mut">${esc(m.userData.info)}</span></button>`).join('')}
function mount3D(id){const host=document.getElementById(id);if(!host)return;G3.host=host;
 if(!G3.ok){host.innerHTML='<div class="nogl">Энэ төхөөрөмж дээр 3D дүрслэл ажиллахгүй байна. Бусад хэсгийг ашиглах боломжтой.</div>';return}
 host.innerHTML='<div class="info3d"></div><div class="hud"></div>';host.prepend(G3.R.domElement);
 host.querySelector('.hud').innerHTML=(id==='stageHome'?MODELS.map((m,i)=>`<button class="chip" data-model="${i}" aria-pressed="${G3.model===i}">${m.name}</button>`).join(''):'')+(MODELS[G3.model].net?Object.keys(NETS).map(k=>`<button class="chip" data-net="${NETS[k]}" aria-pressed="${G3.net===NETS[k]}">${k}</button>`).join(''):'')+`<button class="chip" data-zoom="-1" aria-label="Ойртуулах">＋</button><button class="chip" data-zoom="1" aria-label="Холдуулах">－</button>`;
 size3D();build3D()}

 if(d.part!==undefined){select(G3.meshes[+d.part]);G3.host.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});return}
 if(d.game){game.tab=d.game;if(S.view==='games'){document.querySelectorAll('[data-game]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.game===game.tab));startGame()}return}
 if(d.mc!==undefined){const m=game.m,i=+d.mc;if(t.classList.contains('up')||t.classList.contains('done')||m.open.length>=2)return;
  t.classList.add('up');m.open.push(i);if(m.open.length===2){m.moves++;$('#mv').textContent=m.moves;const[a,b]=m.open,ba=document.querySelector(`[data-mc="${a}"]`),bb=document.querySelector(`[data-mc="${b}"]`);
   if(m.cards[a].k===m.cards[b].k){ba.className=bb.className='done';m.open=[];m.done++;if(m.done===PAIRS[S.subj].length)setTimeout(()=>$('#gameBox').insertAdjacentHTML('beforeend',`<p style="margin-top:16px"><b>Баяр хүргэе!</b> ${m.moves} нүүдлээр дуусгалаа. <button data-game="mem">Дахин</button></p>`),300)}
   else setTimeout(()=>{ba.classList.remove('up');bb.classList.remove('up');m.open=[]},900)}return}
 if(d.bit!==undefined){const b=game.b,i=+d.bit;b.bits[i]^=1;t.setAttribute('aria-pressed',!!b.bits[i]);t.firstChild.textContent=b.bits[i];
  const n=b.bits.reduce((s,v,j)=>s+v*(128>>j),0);$('#bn').textContent=n;if(n===b.target){b.lv++;toast('Зөв! Дараагийн тоо');setTimeout(startGame,700)}return}
 if(t.id==='fT'||t.id==='fF'){const f=game.f;if(f.list[f.i][1]===(t.id==='fT'?1:0))f.sc++;$('#fs').textContent=f.sc;f.i++;showTF();return}
 if(d.tlang){TL.lang=d.tlang;TL.id=null;render();return}
 if(d.tl){tLoad(d.tl);$('#tin')?.focus({preventScroll:true});return}
 if(t.id==='tRestart'){closeModal();tLoad(TL.id,TL.id==='custom'?TL.text:null);$('#tin')?.focus({preventScroll:true});return}
 if(t.id==='tNext'){closeModal();tLoad(d.next);$('#tin')?.focus({preventScroll:true});return}
 if(t.id==='tCustom'){const v=($('#tcx').value||'').replace(/\s+/g,' ').trim().slice(0,600);if(!v)return toast('Текст оруулна уу');TL.lang=/[а-яёөү]/i.test(v)?'mn':'en';TL.id='custom';TL.text=v;render();$('#tin')?.focus({preventScroll:true});return}
 if(d.case)return openCase(d.case);
 if(d.vote!==undefined){LS.set('vote_'+d.cid,+d.vote);return openCase(d.cid)}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#palette').addEventListener('click',e=>{if(e.target.id==='palette')closeModal()});
render();
(async()=>{try{if(window.claude&&claude.use)C.dl=await claude.use('downloads')}catch(e){}})();
}
</script>
</body>
</html>
