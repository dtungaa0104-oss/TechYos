<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТехЁс</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: confident, future-facing studio for a school — precise like an IDE, warm like a classroom.
   IDEA: a silicon chip under glass — the hero is a live die you turn; the curriculum reads like a docs site with paper you print.
   PICTURE: full-bleed night hero with a live 3D model on a glowing grid; bento tiles that move (typing, bits, quiz).
   COLOUR and TYPE: cobalt #2f45ff lead, coral #ff5b3a spark, mint for success; night #060a22 hero; Unbounded display, Onest text, JetBrains Mono for code.
   LAYOUT: sticky glass bar with scrolling nav + ⌘K search; hero; bento grid; docs layout (tree + paper) for programs. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#070a18);--ink:light-dark(#0b0e1a,#eef1ff);--mut:light-dark(#5b6275,#9aa3c7);
--sur:light-dark(#f3f5fb,#0f1430);--sur2:light-dark(#e8ecf8,#161c40);--line:light-dark(#e2e6f0,#20285a);
--pri:light-dark(#2f45ff,#7d8cff);--co:#ff5b3a;--mint:light-dark(#00a878,#2fe0a8);--night:#060a22;
--r:20px;--sh:0 1px 0 var(--line),0 18px 40px -18px light-dark(#1b2a8a33,#000c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Onest,"Noto Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Unbounded,Onest,sans-serif;line-height:1.08;text-wrap:balance;margin:0 0 .45em;letter-spacing:-.01em}
h1{font-size:clamp(32px,5vw,58px);font-weight:700}h2{font-size:clamp(24px,3vw,36px);font-weight:700}h3{font-size:18px;font-weight:600}
p{margin:0 0 .8em;max-width:68ch}a{color:var(--pri)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.band{padding:clamp(32px,5vw,72px) max(5vw,16px)}.wrap{max-width:1240px;margin:0 auto}
.mut{color:var(--mut)}.small{font-size:13.5px}
/* top bar */
header{position:sticky;top:0;z-index:30;background:light-dark(#ffffffd9,#070a18d9);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:10px max(4vw,16px);max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:700 15px Unbounded,sans-serif;color:var(--ink);text-decoration:none;flex:none}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;mask-image:linear-gradient(90deg,#000 92%,transparent)}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--mut);text-decoration:none;padding:9px 12px;border-radius:10px;font-size:14.5px;font-weight:500;min-height:40px;display:inline-flex;align-items:center}
nav a:hover{color:var(--ink);background:var(--sur)}nav a[aria-current]{color:var(--ink);background:var(--sur2)}
.kbtn{flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--sur);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:8px 10px 8px 12px;min-height:42px;font:500 14px Onest,sans-serif;cursor:pointer}
.kbtn kbd{font:600 12px "JetBrains Mono",monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink)}
/* controls */
button,.btn{font:600 15px Onest,sans-serif;border-radius:12px;border:1px solid transparent;background:var(--pri);color:#fff;padding:11px 18px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .15s,background .15s}
button:hover,.btn:hover{transform:translateY(-1px)}
.ghost{background:var(--sur)!important;color:var(--ink)!important;border-color:var(--line)!important}
.co{background:var(--co)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--co);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,select,textarea{font:16px Onest,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-weight:600;font-size:14.5px;display:block;margin:10px 0 4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sur2);color:var(--ink)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.mt{color:var(--pri)}.tag.ie{color:var(--co)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{background:none;border:0;color:var(--mut);min-height:40px;padding:8px 14px;border-radius:10px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 0 var(--line),0 4px 12px -6px #0003}
.pins{display:flex;flex-wrap:wrap;gap:6px}
.pins button{width:46px;height:46px;padding:0;justify-content:center;font:700 15px "JetBrains Mono",monospace;background:var(--sur);color:var(--ink);border:1px solid var(--line);border-radius:12px;position:relative}
.pins button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 0 0 4px light-dark(#2f45ff22,#7d8cff33)}
/* hero */
.hero{background:var(--night);color:#eef1ff;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40px;z-index:-1;background:
 radial-gradient(60% 70% at 72% 40%,#2f45ff66,transparent 65%),radial-gradient(40% 40% at 10% 100%,#ff5b3a33,transparent 70%),
 linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/40px 40px;
 mask-image:radial-gradient(90% 90% at 60% 40%,#000 40%,transparent);animation:drift 30s linear infinite}
@keyframes drift{to{background-position:0 0,0 0,0 40px,40px 0}}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,3vw,40px);align-items:center}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#9fb0ff,#fff 60%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:#b9c2ec;font-size:18px}
.hero .btn{background:#fff;color:var(--night)}.hero .btn.alt{background:#ffffff14;color:#fff;border-color:#ffffff2e}
.hero .seg{background:#ffffff0f;border-color:#ffffff1f}.hero .seg button{color:#b9c2ec}.hero .seg button[aria-pressed=true]{background:#fff;color:var(--night)}
.term{font:500 14px "JetBrains Mono",monospace;color:#9fb0ff;margin:18px 0 0}
.term b{color:#2fe0a8;font-weight:500}.cur{display:inline-block;width:9px;height:1.05em;background:#2fe0a8;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}
.stats div{background:#ffffff0a;border:1px solid #ffffff1a;border-radius:14px;padding:10px 12px}
.stats b{display:block;font:700 24px "JetBrains Mono",monospace;color:#fff}.stats span{font-size:12.5px;color:#9aa3c7}
.stage{position:relative;height:clamp(340px,46vw,540px);border-radius:28px;background:radial-gradient(80% 70% at 50% 35%,#1d2a8a,#0a1040 70%,#070b28);border:1px solid #ffffff1f;overflow:hidden;touch-action:none;box-shadow:0 40px 90px -30px #2f45ff88,inset 0 1px 0 #ffffff26}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;cursor:grab}
.stage .hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}.stage .hud>*{pointer-events:auto}
.chip{background:#0a1040cc;color:#eef1ff;border:1px solid #ffffff2a;border-radius:99px;padding:7px 13px;font:600 13px Onest,sans-serif;min-height:36px;cursor:pointer;backdrop-filter:blur(8px)}
.chip[aria-pressed=true]{background:#fff;color:var(--night)}
.info3d{position:absolute;top:12px;left:12px;max-width:min(320px,75%);background:#070b28d9;backdrop-filter:blur(10px);color:#dfe5ff;border-radius:16px;padding:12px 14px;font-size:14px;border:1px solid #ffffff26}
.info3d b{display:block;font:600 14.5px Unbounded,sans-serif;color:#fff;margin-bottom:4px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:#cfd8ff;text-align:center;padding:20px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(180px,auto);gap:14px}
.tile{position:relative;background:var(--sur);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--pri)}
.tile h3{margin:0}.tile p{margin:0;color:var(--mut);font-size:14.5px}
.tile .go{margin-top:auto;font-weight:600;color:var(--pri);font-size:14.5px}
.b2{grid-column:span 2}.r2{grid-row:span 2}
.tile.dark{background:var(--night);color:#eef1ff;border-color:#1f2a66}.tile.dark p{color:#9aa3c7}.tile.dark .go{color:#9fb0ff}
.mini-tl{display:grid;gap:8px;margin:10px 0}
.mini-tl div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.mini-tl i{display:block;height:34px;border-radius:10px;background:linear-gradient(90deg,var(--pri),light-dark(#6b7bff,#5160ff));color:#fff;font-style:normal;font-size:13px;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-tl div:nth-child(2) i{background:linear-gradient(90deg,#4c5cff,#7a86ff)}.mini-tl div:nth-child(3) i{background:linear-gradient(90deg,var(--co),#ff8a5c)}.mini-tl div:nth-child(4) i{background:linear-gradient(90deg,#00a878,#2fe0a8)}
.typer{font:500 20px "JetBrains Mono",monospace;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:58px}
.typer span{color:var(--mut)}
.bitrow{display:flex;gap:6px;margin:6px 0}.bitrow i{flex:1;aspect-ratio:1;border-radius:8px;background:#ffffff14;display:grid;place-items:center;font:700 13px "JetBrains Mono";font-style:normal;color:#9aa3c7;transition:background .3s}
.bitrow i.on{background:var(--co);color:#fff}
/* docs */
.docs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;padding-right:6px}
.tree{margin-top:14px;display:grid;gap:2px}
.tree button{background:none;border:0;color:var(--ink);justify-content:flex-start;text-align:start;font-weight:500;padding:8px 10px;min-height:38px;border-radius:10px;font-size:14.5px;width:100%}
.tree button:hover{background:var(--sur);transform:none}
.tree button[aria-current]{background:var(--sur2);color:var(--pri)}
.tree .u{font-weight:700;margin-top:8px}.tree .u small{color:var(--mut);font-weight:500;margin-inline-start:auto;font-family:"JetBrains Mono",monospace}
.tree .l{padding-left:24px;color:var(--mut);font-size:14px}
.dbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:64px;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.crumb{font-size:14px;color:var(--mut)}.crumb b{color:var(--ink)}
.paper{background:#fff;color:#111;max-width:860px;margin:0 auto;padding:clamp(22px,5vw,56px);border-radius:8px;box-shadow:0 1px 0 #0000000f,0 30px 60px -30px #0b0e1a55;font:15px/1.6 Onest,Arial,sans-serif}
.paper h1{font:700 22px Onest,Arial,sans-serif;text-align:center;margin-bottom:16px;letter-spacing:0}
.paper h2{font:700 16px Onest,Arial,sans-serif;color:#1f2fbf;margin:20px 0 8px;letter-spacing:0}
.paper table{border-collapse:collapse;width:100%;margin:6px 0 10px}
.paper td,.paper th{border:1px solid #9aa0ad;padding:7px 9px;text-align:left;vertical-align:top;font-size:14px}
.paper th{background:#e8ecff}.paper .meta td:first-child{font-weight:700;width:30%;background:#f6f7fb}
.paper ul{margin:4px 0 10px;padding-left:22px}.paper p{white-space:pre-line;max-width:none}
.paper .ln{border-bottom:1px solid #999;height:28px}
.usel{display:flex;flex-direction:column;gap:4px;font-size:12.5px}.usel span{opacity:.75}.usel select{font:14px Onest,Arial,sans-serif;padding:9px 12px;border-radius:12px;border:1px solid var(--line,#ccd);background:var(--sur,#fff);color:inherit;max-width:min(92vw,460px)}
.wwc{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-width:820px}.wwc button{font-size:13.5px;padding:8px 13px;border-radius:999px}.wwc button.wrong{background:var(--co);color:#fff;opacity:.6}
.uapart{font:700 14px Onest,Arial,sans-serif;margin:16px 0 8px;color:#1f2fbf}.mcq{border:0;padding:0;margin:0}.mcq legend{font-weight:600;margin-bottom:6px}.mcq label{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;cursor:pointer}
.uagh .cnt{display:inline-flex;align-items:center;gap:6px;margin-left:6px}.uagh .cnt b{font-size:12.5px;min-width:34px;text-align:center}
.lvtag{display:inline-block;font:600 11.5px 'JetBrains Mono',monospace;color:#1f2fbf;background:light-dark(#e8ecff,#1a2150);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.exam input{font:15px Onest,Arial,sans-serif;padding:9px 12px;border-radius:12px;border:1px solid var(--line,#ccd);background:var(--sur,#fff);color:inherit}
.alay{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.alay{grid-template-columns:1fr}}
.asb{display:grid;gap:14px;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}@media(max-width:900px){.asb{position:static;max-height:none}}
.acard{background:var(--sur,#fff);border:1px solid var(--line,#dde);border-radius:16px;padding:16px}.acard h3{font:700 16px Onest,Arial,sans-serif;margin:0 0 6px}.acard .mut{font-size:13px;margin:0 0 8px;opacity:.75}
.acard .usel select{width:100%;max-width:none}
.csg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0 12px}.cs{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}.cs small{display:block;font-weight:400;opacity:.7}
.cs select{font:600 15px Onest,Arial,sans-serif;padding:8px 10px;border-radius:10px;border:1px solid var(--line,#ccd);background:var(--sur,#fff);color:inherit}
button.wide,.btn.wide{width:100%;justify-content:center}.adet{border-top:1px solid var(--line,#dde);margin-top:12px;padding-top:10px}.adet summary{cursor:pointer;font-weight:700;font-size:13.5px;color:light-dark(#1f7a55,#5fd3a2)}
.adet .uap{border:0;padding:8px 0 0;background:none;margin:0}.adet .uap .uah{display:none}
.codei{width:100%;font:12.5px 'JetBrains Mono',monospace;padding:9px 10px;border-radius:10px;border:1px solid var(--line,#ccd);background:var(--bg,#f6f7fb);color:inherit}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:8px 0}.chk input[type=number]{padding:6px 8px;border-radius:8px;border:1px solid var(--line,#ccd)}
.qrbox{display:flex;justify-content:center;margin:12px 0 8px}.qrbox svg{width:170px;height:170px;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line,#dde)}.qrbig svg{width:min(70vh,80vw);height:auto;display:block;margin:10px auto;background:#fff}
.amain,.gridbg{background-color:light-dark(#f4f7fb,#0e1226);background-image:linear-gradient(light-dark(#e3e9f3,#1a2040) 1px,transparent 1px),linear-gradient(90deg,light-dark(#e3e9f3,#1a2040) 1px,transparent 1px);background-size:24px 24px}
.amain{border-radius:18px;padding:clamp(10px,2.5vw,28px)}
.sheet{background:#fff;color:#111;border-radius:12px;box-shadow:0 1px 0 #0000000f,0 20px 50px -30px #0b0e1a66;padding:clamp(18px,4vw,44px);font:15px/1.55 Onest,Arial,sans-serif;max-width:900px;margin:0 auto}
.shead{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:2px solid #1f2fbf;padding-bottom:12px;margin-bottom:10px}.shead b{display:block;font:700 20px Onest,Arial,sans-serif}.shead span{font-size:13.5px;color:#555}
.stot{text-align:center;background:#1f2fbf;color:#fff;border-radius:12px;padding:6px 14px;min-width:70px}.stot b{font-size:20px}.stot span{color:#dfe3ff;font-size:11.5px}
.sinfo{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;color:#333;margin:8px 0 6px}
.spart{font:700 15px Onest,Arial,sans-serif;color:#1f2fbf;margin:22px 0 4px;padding-top:12px;border-top:1px dashed #c9cfe0}.spart small{font-weight:500;color:#666;margin-left:6px}
.ql{list-style:none;margin:0;padding:0}.qi{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eceff5}
.qn{flex:none;width:28px;height:28px;border-radius:50%;background:#16233f;color:#fff;font:700 13px Onest,Arial,sans-serif;display:grid;place-items:center;margin-top:1px}
.qb{flex:1;min-width:0}.qt{margin:2px 0 10px;font-size:15.5px;color:#111;display:block;font-weight:500}
.opts4{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.op{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid #cfd5e3;border-radius:8px;padding:9px 12px;background:#fff;color:#111;font:14.5px/1.35 Onest,Arial,sans-serif;min-height:44px;width:100%}
button.op{cursor:pointer}button.op:hover:not(:disabled){border-color:#1f2fbf;background:#f5f7ff}button.op:disabled{opacity:1;cursor:default}
.ol{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #16233f;display:grid;place-items:center;font:700 12px Onest,Arial,sans-serif}
.op.on{border-color:#1f2fbf;background:#eef1ff;box-shadow:inset 0 0 0 1px #1f2fbf}.op.on .ol{background:#1f2fbf;color:#fff;border-color:#1f2fbf}
.op.ok{border-color:#1b9e6b;background:#e9f9f1}.op.ok .ol{background:#1b9e6b;color:#fff;border-color:#1b9e6b}.op.bad{border-color:#e0533d;background:#fdeeea}.op.bad .ol{background:#e0533d;color:#fff;border-color:#e0533d}
.ctx{white-space:pre-line;background:#f6f8fc;border:1px solid #dfe5f0;border-left:4px solid #1f2fbf;border-radius:8px;padding:10px 12px;font-size:14.5px;margin:2px 0 10px;font-family:Onest,Arial,sans-serif}.qt.sub{margin:12px 0 6px}.opts5{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.spsub{font-size:13px;color:#555;margin:4px 0 0}.qt{white-space:pre-line}
.qmeta{display:block;font-size:12px;color:#777;margin-top:8px}.qmeta .lvtag{margin:0 6px 0 0}
.hint{margin-top:10px;background:#fff8dc;color:#7a5a00;border:1px dashed #e6c35a;border-radius:999px;padding:4px 12px;min-height:0;font:600 12.5px Onest,Arial,sans-serif}.hintx{display:block;margin-top:8px;font-size:13px;background:#fff8dc;border-radius:8px;padding:8px 10px;color:#5d4500}
.ansl{background:repeating-linear-gradient(transparent 0 25px,#c9cfdd 25px 26px);margin:4px 0}
.sheet textarea{width:100%;font:15px/1.5 Onest,Arial,sans-serif;border:1px solid #cfd5e3;border-radius:8px;padding:10px;background:repeating-linear-gradient(#fff 0 26px,#eef1f7 26px 27px);color:#111}
.sheet input{font:15px Onest,Arial,sans-serif;padding:9px 12px;border-radius:10px;border:1px solid #cfd5e3;background:#fff;color:#111}.sheet .usel span{color:#555}

/* blocks: h1 | h2 | p | meta(rows) | table(head,rows,w) | list(items) | lines(n) */
function blocksHTML(B){return B.map(b=>{
 if(b.t==='h1')return `<h1>${esc(b.x)}</h1>`;if(b.t==='h2')return `<h2>${esc(b.x)}</h2>`;if(b.t==='p')return `<p>${esc(b.x)}</p>`;
 if(b.t==='meta')return `<table class="meta">${b.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>`;
 if(b.t==='table')return `<table><thead><tr>${b.head.map((h,i)=>`<th style="width:${b.w?b.w[i]/50:''}%">${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td style="white-space:pre-line">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 if(b.t==='list')return `<ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
 if(b.t==='lines')return '<div class="ln"></div>'.repeat(b.n||2);if(b.t==='web')return webSVG(b);return ''}).join('')}
const docHTML=(title,body)=>`<!DOCTYPE html><html lang="mn"><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4;margin:18mm}body{font:12pt/1.5 Arial,sans-serif;color:#111;max-width:800px;margin:0 auto;padding:20px}h1{font-size:16pt;text-align:center}h2{font-size:12.5pt;color:#1f2fbf;margin:16px 0 6px}table{border-collapse:collapse;width:100%;margin:6px 0 10px}td,th{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top;font-size:11pt}th{background:#e8ecff}.meta td:first-child{font-weight:700;width:30%}p{white-space:pre-line}.ln{border-bottom:1px solid #999;height:26px}.np{background:#fff4c7;padding:8px;font-family:Arial}@media print{.np{display:none}}</style></head><body><p class="np">Хэвлэхдээ Ctrl+P (Mac: Cmd+P) дарна уу.</p>${body}</body></html>`;

const XE=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wr=(t,o={})=>`<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial" w:eastAsia="Arial"/>${o.b?'<w:b/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}<w:sz w:val="${o.sz||22}"/><w:szCs w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${XE(t)}</w:t></w:r>`;
const wp=(t,o={})=>String(t??'').split('\n').map(line=>`<w:p><w:pPr>${o.al?`<w:jc w:val="${o.al}"/>`:''}<w:spacing w:before="${o.bf||0}" w:after="${o.af??80}"/></w:pPr>${wr(line,o)}</w:p>`).join('');
function wt(head,rows,w,metaStyle){
 const n=(head||rows[0]).length,ws=w||Array(n).fill(Math.floor(5000/n));
 const cell=(t,i,h)=>`<w:tc><w:tcPr><w:tcW w:w="${ws[i]}" w:type="pct"/>${h||(metaStyle&&i===0)?`<w:shd w:val="clear" w:color="auto" w:fill="${h?'E8ECFF':'F4F5FA'}"/>`:''}</w:tcPr>${wp(t,{b:h||(metaStyle&&i===0),af:30,sz:21})}</w:tc>`;
 return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:space="0" w:color="8A8F9C"/>`).join('')}</w:tblBorders><w:tblCellMar><w:left w:w="90" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map(x=>`<w:gridCol w:w="${Math.round(x/5000*9354)}"/>`).join('')}</w:tblGrid>${head?`<w:tr><w:trPr><w:tblHeader/></w:trPr>${head.map((h,i)=>cell(h,i,true)).join('')}</w:tr>`:''}${rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c,i)=>cell(c,i,false)).join('')}</w:tr>`).join('')}</w:tbl>${wp('',{af:60})}`}
function docxXML(B){return B.map(b=>{
 if(b.t==='h1')return wp(b.x,{b:1,sz:30,al:'center',af:200});if(b.t==='h2')return wp(b.x,{b:1,sz:24,c:'1F2FBF',bf:200,af:80});if(b.t==='p')return wp(b.x);
 if(b.t==='meta')return wt(null,b.rows,[1500,3500],true);if(b.t==='table')return wt(b.head,b.rows,b.w);
 if(b.t==='list')return b.items.map(i=>wp('•  '+i,{af:40})).join('');if(b.t==='lines')return Array(b.n||2).fill(wp('_______________________________________________________________________________',{af:120,c:'888888'})).join('');if(b.t==='web')return wp('Төв ойлголт: '+b.c,{b:1,al:'center',af:60})+wt(['Салаа','Түлхүүр үг, ойлголт'],b.nodes.map(n=>[n.t,n.sub.join('\n')]),[2000,3000]);return ''}).join('')}

 z.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${docxXML(B)}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="851" w:bottom="1134" w:left="1418" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`);

}

":"Давтагддаг кодыг функц болгон дахин ашиглах.","th":["def нэр(параметр): … return утга. Функц нь программыг хэсэгчилж, ойлгомжтой болгодог (дэд программ).","Евклидийн алгоритм: ХИЕХ(a, b) = ХИЕХ(b, a mod b), b = 0 үед a. ХБЕХ = a·b / ХИЕХ.","Функц дотор үүсгэсэн хувьсагч зөвхөн тэр функц дотор хүчинтэй (локал)."],"ex":"def gcd(a, b):\n    while b:\n        a, b = b, a % b\n    return a\n\nprint(gcd(48, 36))   # 12","cpp":null,"probs":[{"id":"p19","t":"ХИЕХ ба ХБЕХ","st":"Хоёр тооны хамгийн их ерөнхий хуваагч ба хамгийн бага ерөнхий хуваагдагчийг ол.","inp":"a b (1 ≤ a, b ≤ 10⁹)","out":"ХИЕХ ХБЕХ","sol":"a,b=map(int,input().split())\nx,y=a,b\nwhile y: x,y=y,x%y\nprint(x,a//x*b)","hint":"Евклидийн алгоритмыг функц болгон бич.","starter":"def gcd(a, b):\n    # энд бич\n    pass\n\na, b = map(int, input().split())\n","S":[["12 18","6 36"]],"T":[["1 1","1 1"],["7 13","1 91"],["1000000000 999999999","1 999999999000000000"],["100 10","10 100"]]},{"id":"p20","t":"Төгс тоо","st":"Өөрөөсөө бусад хуваагчдынхаа нийлбэртэй тэнцүү тоог төгс тоо гэнэ (6 = 1+2+3). 1-ээс n хүртэлх төгс тоонуудыг хэвлэ.","inp":"n (1 ≤ n ≤ 2000)","out":"Тоонууд нэг мөрөнд; байхгүй бол «байхгүй»","sol":"n=int(input())\ndef f(x):\n    return x>1 and sum(d for d in range(1,x) if x%d==0)==x\nr=[str(x) for x in range(1,n+1) if f(x)]\nprint(\" \".join(r) if r else \"байхгүй\")","hint":"is_perfect(x) функц бичээд 1..n-ээр давт.","starter":"def is_perfect(x):\n    pass\n\nn = int(input())\n","S":[["30","6 28"]],"T":[["5","байхгүй"],["6","6"],["2000","6 28 496"],["500","6 28 496"]]}]}]},{"id":"l3","n":"Дунд шат","g":"10–11-р анги","d":"Хоёр хэмжээст массив, эрэмбэлэлт, хайлт, толь бичиг, рекурс.","lessons":[{"id":"l3a","t":"Хоёр хэмжээст массив","goal":"Хүснэгтэн өгөгдлийг мөр, баганаар боловсруулах.","th":["Хоёр хэмжээст массив бол жагсаалтын жагсаалт: a[i][j] — i-р мөр, j-р багана.","Унших: a = [list(map(int, input().split())) for _ in range(n)].","Үндсэн диагональ: a[i][i]; туслах диагональ: a[i][n−1−i]." [x],x))\nprint(b,d[b])","hint":"Тоолоод, давтамж ихээр, тэнцүү бол утга багаар сонго.","starter":"n = int(input())\na = list(map(int, input().split()))\n","S":[["7\n3 1 3 2 1 3 2","3 3"]],"T":[["1\n5","5 1"],["4\n4 4 2 2","2 2"],["6\n-1 -1 -1 0 0 0","-1 3"],["5\n9 8 7 6 5","5 1"]]},{"id":"p28","t":"Анаграм","st":"Хоёр үг ижил үсгүүдээс (тоо нь ч ижил) бүрдсэн бол «тийм».","inp":"2 мөр","out":"тийм/үгүй","sol":"a=input().strip();b=input().strip()\nprint(\"тийм\" if sorted(a)==sorted(b) else \"үгүй\")","hint":"sorted(a) == sorted(b) эсвэл тоолох толь бичиг харьцуул.","starter":"a = input()\nb = input()\n","S":[["салаа\nаалас","тийм"]],"T":[["а\nа","тийм"],["аб\nаа","үгүй"],["листен\nсилент","тийм"],["ааб\nабб","үгүй"]]}]},{"id":"l3e","t":"Рекурс","goal":"Өөрийгөө дууддаг функцээр бодлогыг жижиг бодлогод хуваах.","th":["Рекурсив функц: суурь тохиолдол (зогсох нөхцөл) + өөрийгөө жижиг өгөгдлөөр дуудах алхам.","Жишээ: n! = n·(n−1)!, 0! = 1. Ханойн цамхаг: n дискийг зөөх = n−1-ийг туслах шон руу, том дискийг, n−1-ийг буцааж.","Рекурсийн гүн хэт их бол алдаа өгнө; ийм үед давталт эсвэл динамик програмчлал хэрэглэнэ."],"ex":"def hanoi(n, a, b, c):\n    if n == 0:\n        return\n    hanoi(n - 1, a, c, b)\n    print(a, \"->\", c)\n    hanoi(n - 1, b, a, c)\n\nhanoi(3, \"A\", \"B\", \"C\")","cpp":null,"probs":[{"id":"p29","t":"Ханойн цамхаг","st":"n дискийг A шоноос C шон руу B-г ашиглан зөө. Эхлээд алхмын тоог, дараа нь алхам бүрийг «A C» хэлбэрээр хэвлэ.","inp":"n (1 ≤ n ≤ 10)","out":"2ⁿ−1 + 1 мөр","sol":"n=int(input())\nr=[]\ndef h(n,a,b,c):\n    if n==0: return\n    h(n-1,a,c,b);r.append(a+\" \"+c);h(n-1,b,a,c)\nh(n,\"A\",\"B\",\"C\")\nprint(len(r))\nprint(\"\\n\".join(r))","hint":"Алхмуудыг жагсаалтад цуглуулаад эхлээд уртыг нь хэвлэ.","starter":"n = int(input())\n","S":[["2","3\nA B\nA C\nB C"]],"T":[["1","1\nA C"],["3","7\nA C\nA B\nC B\nA C\nB A\nB C\nA C"],["5","31\nA C\nA B\nC B\nA C\nB A\nB C\nA C\nA B\nC B\nC A\nB A\nC B\nA C\nA B\nC B\nA C\nB A\nB C\nA C\nB A\nC гыг давхцсан дэд бодлогод хувааж, хариуг хадгалан дахин ашиглах.","th":["Динамик програмчлал (ДП): төлөв (dp[i] юуг илэрхийлэх), шилжилт (dp[i]-г өмнөх төлвүүдээс яаж олох), анхны утга, хариу — эдгээр 4-ийг тодорхойлно.","Шат: нэг удаад 1 эсвэл 2 гишгэвэл n-р шатанд хүрэх арга dp[n] = dp[n−1] + dp[n−2].","Тоо их болох тул ихэвчлэн 10⁹+7-д хуваасан үлдэгдлийг хэвлэдэг."],"ex":"n = int(input())\nMOD = 10**9 + 7\ndp = [0] * (n + 1)\ndp[0] = 1\nfor i in range(1, n + 1):\n    dp[i] = dp[i - 1] + (dp[i - 2] if i >= 2 else 0)\n    dp[i] %= MOD\nprint(dp[n])","cpp":"#include <bits/stdc++.h>\nusing namespace std;\nconst long long MOD = 1e9 + 7;\nint main(){\n    int n; cin >> n;\n    vector<long long> dp(n + 1, 0); dp[0] = 1;\n    for (int i = 1; i <= n; i++){\n        dp[i] = dp[i-1];\n        if (i >= 2) dp[i] = (dp[i] + dp[i-2]) % MOD;\n    }\n    cout << dp[n] << \"\\n\";\n}","probs":[{"id":"p39","t":"Шат","st":"Нэг удаад 1, 2 эсвэл 3 шат гишгэж болно. Гэхдээ зарим шат эвдэрсэн тул түүн дээр гишгэж болохгүй. n-р шатанд хэдэн аргаар хүрэх вэ? (mod 10⁹+7)","inp":"n k, дараа нь k эвдэрсэн шатны дугаар (1 ≤ n ≤ 10⁵, n-р шат эвдрээгүй)","out":"Тоо","sol":"import sys\nd=sys.stdin.read().split();n=int(d[0]);k=int(d[1]);bad=set(map(int,d[2:2+k]))\nM=10**9+7;dp=[0]*(n+1);dp[0]=1\nfor i in range(1,n+1):\n    if i in bad: continue\n    dp[i]=(dp[i-1]+(dp[i-2] if i>=2 else 0)+(dp[i-3] if i>=3 else 0))%M\nprint(dp[n])","hint":"dp[i] = dp[i−1] + dp[i−2] + dp[i−3]; эвдэрсэн шатанд dp[i] = 0.","starter":"import sys\ndata = sys.stdin.read().split()\n","S":[["5 1\n2","5"]],"T":[["1 0\n","1"],["4 0\n","7"],["10 3\n3 6 9","21"],["100000 2\n5 77777","667733768"]]},{"id":"p40","t":"Тор дээрх зам","st":"n×m торын зүүн дээд нүднээс баруун доод нүд рүү зөвхөн баруун, доош явна. «#» нүдээр явж болохгүй. Хэдэн зам байна вэ? (mod 10⁹+7)","inp":"n m, дараа нь n мөр («.» эсвэл «#»)","out":"Тоо","sol":"n,m=map(int,input().split());g=[input().strip() for _ in range(n)]\nM=10**9+7;dp=[[0]*m for _ in range(n)]\nfor i in range(n):\n    for j in range(m):\n        if g[i][j]==\"#\": continue\n        if i==0 and j==0: dp[i][j]=1;continue\n        dp[i][j]=((dp[i-1][j] if i else 0)+(dp[i][j-1] if j else 0))%M\nprint(dp[n-1][m-1])","hint":"dp[i][j] = dp[i−1][j] + dp[i][j−1]; «#» бол 0.","starter":"n, m = map(int, input().split())\ng = [input() for _ in range(n)]\n","S":[["3 3\n...\n.#.\n...","2"]],"T":[["1 1\n.","1"],["2 2\n.#\n#.","0"],["3 4\n....\n....\n....","10"],["4 4\n..#.\n....\n.#..\n...#","0"]]}]},{"id":"l5b","t":"ДП: үүргэвч ба ХУӨДД","goal":"Сонгодог ДП бодлогууд: 0/1 үүргэвч, хамгийн урт өсөх дэд дараалал.","th":["0/1 үүргэвч: dp[w] — нийт жин w-ээс хэтрэхгүй үед авах хамгийн их үнэ. Эд зүйл бүрийн хувьд w-ийг их утгаас бага руу гүйлгэнэ: dp[w] = max(dp[w], dp[w − wᵢ] + vᵢ). O(n·W).","Хамгийн урт өсөх дэд дараалал (ХУӨДД): энгийн ДП O(n²); tails массив ба хоёртын хайлтаар O(n log n).","tails[k] — урт нь k+1 байх өсөх дэд дарааллын хамгийн бага сүүлийн элемент."],"ex":"import bisect\na = list(map(int, input().split()))\ntails = []\nfor x in a:\n    i = bisect.bisect_left(tails, x)\n    if i == len(tails): tails.append(x)\n    else: tails[i] = x\nprint(len(tails))","cpp":"#include <bits/stdc++.h>\nusing namespace std;\nint main(){\n    int n, W; cin >> n >> W;\n    vector<long long> dp(W + 1, 0);\n    for (int i = 0; i < n; i++){\n        int w, v; cin >> w >> v;\n        for (int c = W; c >= w; c--) dp[c] = max(dp[c], dp[c-w] + v);\n    }\n    cout << dp[W] << \"\\n\";\n}","probs":[{"id":"p41","t":"Үүргэвч","st":"n эд зүйл (жин, үнэ), үүргэвчний даац W. Нийт жин W-ээс хэтрэхгүйгээр авах хамгийн их үнийг ол.","inp":"n W, n мөрөнд w v (n ≤ 100, W ≤ 10⁴)","out":"Хамгийн их үнэ","sol":"import sys\nd=sys.stdin.read().split();n,W=int(d[0]),int(d[1]);dp=[0]*(W+1)\nfor i in range(n):\n    w,v=int(d[2+2*i]),int(d[3+2*i])\n    for c in range(W,w-1,-1):\n        if dp[c-w]+v>dp[c]: dp[c]=dp[c-w]+v\nprint(dp[W])","hint":"w-г W-ээс доош гүйлгэвэл эд зүйл бүрийг нэг л уда nt u, v; cin >> u >> v; g[u].push_back(v); g[v].push_back(u); }\n    vector<int> d(n + 1, -1); queue<int> q; q.push(1); d[1] = 0;\n    while (!q.empty()){ int u = q.front(); q.pop();\n        for (int v : g[u]) if (d[v] < 0){ d[v] = d[u] + 1; q.push(v); } }\n    cout << d[n] << \"\\n\";\n}","probs":[{"id":"p43","t":"Лабиринт","st":"n×m лабиринтын «S»-ээс «E» хүртэлх хамгийн богино замын алхмын тоог ол (дээш, доош, зүүн, баруун). «#» — хана. Хүрэх боломжгүй бол −1.","inp":"n m, n мөр","out":"Алхмын тоо","sol":"from collections import deque\nn,m=map(int,input().split());g=[input().strip() for _ in range(n)]\nfor i in range(n):\n    for j in range(m):\n        if g[i][j]==\"S\": s=(i,j)\n        if g[i][j]==\"E\": e=(i,j)\nd={s:0};q=deque([s])\nwhile q:\n    i,j=q.popleft()\n    for a,b in((i+1,j),(i-1,j),(i,j+1),(i,j-1)):\n        if 0<=a<n and 0<=b<m and g[a][b]!=\"#\" and (a,b) not in d: d[(a,b)]=d[(i,j)]+1;q.append((a,b))\nprint(d.get(e,-1))","hint":"S-ээс BFS хийж, нүд бүрийн зайг хадгал.","starter":"from collections import deque\nn, m = map(int, input().split())\ng = [input() for _ in range(n)]\n","S":[["4 5\nS...#\n.##.#\n...#.\n#...E","7"]],"T":[["1 2\nSE","1"],["2 2\nS#\n#E","-1"],["3 3\nS..\n...\n..E","4"],["5 5\nS#...\n.#.#.\n.#.#.\n.#.#.\n...#E","16"],["20 30\nS###..........#..#...#......##\n.#.......#.#..#.##.......#####\n........#....#.......##.#...#.\n#.......##..........#.......##\n....#.##..#..#.#.####....####.\n..##...##......##.#.#..#......\n#.......##.#......##.....#....\n.##...#..#...##...#.....#.....\n#.....#..##.....##..##.#..##..\n..####....#.#.#....#...#......\n#...##.....##..#...###.##.....\n......#...##.#........#..#....\n......#.#...#.#.#...#.#.##..#.\n..#...#.#.....#.#..#..##...#.#\n...##..#......#.##....#..###..\n...##..##.#..#...#.##.........\n.....#....#.....#.......#...#.\n..#...#...##.....#.##.###.....\n..#.#...#.#.....#....##.....##\n....#.....#..##.......#...###E","-1"]]},{"id":"p44","t":"Арлын тоо","st":"n×m газрын зурагт «#» — хуурай газар, «.» — ус. Дөрвөн чиглэлд хөрш хуурай газрууд нэг арал болно. Хэдэн арал байна вэ?","inp":"n m, n мөр (n, m ≤ 300)","out":"Тоо","sol":"n,m=map(int,input().split());g=[list(input().strip()) for _ in range(n)];c=0\nfor i in range(n):\n    for j in range(m):\n        if g[i][j]==\"#\":\n            c+=1;st=[(i,j)];g[i][j]=\".\"\n            while st:\n                x,y=st.pop()\n                for a,b in((x+1,y),(x-1,y),(x,y+1),(x,y-1)):\n                    if 0<=a<n and 0<=b<m and g[a][b]==\"#\": g[a][b]=\".\";st.append((a,b))\nprint(c)","hint":"Хуурай газар олох бүрт DFS-ээр бүх арлыг «ус» болгож, тоолуурыг нэмэгдүүл. Рекурсийн оронд стек ашигла.","starter":"n, m = map(int, input().split())\ng = [list(input()) for _ in range(n)]\n","S":[["4 5\n##..#\n#...#\n..#..\n.....","3"]],"T":[["1 1\n.","0"],["1 1\n#","1"],["3 3\n#.#\n.#.\n#.#","5"],["3 4\n####\n#..#\n####","1"],["30 40\n##.#..##.#..#.#...##...##...#...##....#.\n#...#..#..#.##..#.......##........#..#..\n...#.....#.#..##..#...#.#.##...###......\n...........##.#.##....####...##..#..###.\n....#.#.#.#........#.....##....#.#...#..\n......#.##.#...#..##..##..##...#..#..##.\n.#.#.###...#..#.#.#......#......#.#...#.\n##.##....#........#......######.##..#.##\n....#...#..#..#.#.#..#....#..###.#....##\n##......####..#...#..#......#.#....#....\n..#...#...#..#.#....#######.#..#.#.###..\n.....#....#..#.#.#..####..##.....###...#\n##...##.#...#.##....#####...#..........#\n....##.###....#....#.#.#..###..##.##.###\n..#.#.....#..###....#..###..#.#..#......\n#..#..........#..#.....##...#..#.##..#.#\n...###.....##.#.#.###.#.#.....#.#.#.##..\n..........###..#.#.##.....#.....#.#..#..\n..............##....##.......###.......#\n##.#.....##.......#.##.#..#.##..#..###.#\n...#....#....#.#.....###.#.##....####..#\n..###...#.#.#........##..##.#.#####.....\n....#..#.##...#..#.##.#........#...#...#\n..#.#####.##.#......##...##.#.####.#..##\n.....#.##....#.#...##.##..###.###...#..#\n##.##...##.#..#...##....######.#...##..#\n#.#..#. lab({id:'rgb',s:'mt',g:[8],u:'Зураг боловсруулах технологи',name:'RGB өнгөний загвар',desc:'Улаан, ногоон, цэнхэр (0–255) гэрлийг хольж бүх өнгийг гаргана.',zoom:9,build(P){

 const cube=P('RGB шоо','Тэнхлэг бүр нэг үндсэн өнгө (0–255). Шооны дотор цэг бүр нэг өнгө. Нийт 256³ ≈ 16.7 сая өнгө.',[0,0,0],[0,0,0]);const geo=B(3,3,3),col=[];const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){col.push(pos.getX(i)/3+.5,pos.getY(i)/3+.5,pos.getZ(i)/3+.5)}geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 cube.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.55})));cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xffffff})));
 C.forEach(([n,c,[r,g,b]])=>{const p=P(n,`${n}: R=${r*255}, G=${g*255}, B=${b*255}. ${r+g+b===0?'Гэрэл огт байхгүй.':r+g+b===3?'Гурван өнгө бүрэн хольсон.':r+g+b===2?'Хоёр үндсэн өнгийг хольсон.':'Үндсэн өнгө.'}`,[(r-.5)*3,(g-.5)*3,(b-.5)*3],[(r-.5)*1.2,(g-.5)*1.2,(b-.5)*1.2]);p.add(mk(SP(.3),mat(c,{e:c,ei:.35,r:.3})))});

function flowModel(P,steps,links){const N=steps.map(([n,info,shape,pos,col])=>{const g=P(n,info,pos,[0,0,pos[0]*.15]);let geo;
  if(shape==='oval'){geo=CY(.55,.55,.3,40);const m=mk(geo,mat(col),null,[Math.PI/2,0,0],[1.9,1,.8]);g.add(m)}
  else if(shape==='para'){const s=new THREE.Shape();s.moveTo(-1,-.4);s.lineTo(.75,-.4);s.lineTo(1,.4);s.lineTo(-.75,.4);s.closePath();const e=new THREE.ExtrudeGeometry(s,{depth:.3,bevelEnabled:true,bevelSize:.03,bevelThickness:.03});e.center();g.add(mk(e,mat(col)))}
  else if(shape==='rhomb'){const s=new THREE.Shape();s.moveTo(0,-.65);s.lineTo(1.1,0);s.lineTo(0,.65);s.lineTo(-1.1,0);s.closePath();const e=new THREE.ExtrudeGeometry(s,{depth:.3,bevelEnabled:true,bevelSize:.03,bevelThickness:.03});e.center();g.add(mk(e,mat(col)))}
  else g.add(mk(rbox(2,.8,.3,.05),mat(col)));
  const lbl=txtSprite(n.replace(/^\d+\.\s*/,''),'#fff');lbl.position.set(0,0,.3);lbl.scale.set(2,.38,1);g.add(lbl);return pos});
 links.forEach(([a,b,via])=>{const pts=[N[a],...(via||[]),N[b]];for(let i=0;i<pts.length-1;i++)G3.root.add(lineBetween(pts[i],pts[i+1],0x9fb0ff))});return N}

 const fl=P('Шал ба хоймор','Хаалганы эсрэг талын хүндэт хэсэг — хоймор. Баруун тал — эрэгтэй, зүүн тал — эмэгтэй хүний тал гэж уламжлалт ёсоор ялгана.',[0,-.3,0],[0,-.6,0]);fl.add(mk(CY(3.3,3.3,.12,48),mat(0xb5835a,{r:.8})));

 const uni=P('Унь','Ханыг тоонотой холбох урт мод. Гэрийн дээврийн налууг бүрдүүлнэ.',[0,0,0],[0,.8,0]);const um=mat(0xe8590c);for(let i=0;i<48;i++){const a=i/48*Math.PI*2,x=Math.cos(a),z=Math.sin(a);uni.add(rod([x*3,1.9,z*3],[x*.78,3.4,z*.78],.03,um))}
 const too=P('Тооно','Гэрийн оройн дугуй цонх. Гэрэл, агаар орж, утаа гарна. Тооно — гэр бүлийн бэлгэдэл.',[0,3.4,0],[0,1.4,0]);too.add(mk(TO(.75,.1,12,40),mat(0xf08c00,{r:.5}),null,[Math.PI/2,0,0]));for(let i=0;i<4;i++)too.add(mk(B(1.5,.06,.06),mat(0xf08c00),[0,0,0],[0,i*Math.PI/4,0]));
 const bag=P('Багана','Тооног тулах хоёр багана. Багана, тоонотой хүндэтгэлтэй харьцана — түших, алхахгүй байх ёс бий.',[0,1.5,0],[0,.6,0]);[-.35,.35].forEach(x=>bag.add(mk(B(.12,3.6,.12),mat(0xf08c00),[x,.05,0])));
 const hal=P('Хаалга','Ихэвчлэн урд зүг рүү харуулна. Хаалганы тотгон дээр гишгэхгүй, хаалгыг тас хаахгүй байх ёстой.',[0,.6,3.05],[0,0,1.2]);hal.add(mk(rbox(1.1,1.8,.12,.03),mat(0xe03131,{r:.5})));hal.add(mk(B(.8,1.4,.02),mat(0xf59f00),[0,0,.07]));
 const tuurga=P('Туурга, дээвэр (эсгий)','Хана, униа эсгийгээр бүрж, цагаан бүрээсээр бүтээнэ. Улирлаас хамааран давхаргыг нэмж, хасна.',[0,1.8,0],[0,2.6,0]);tuurga.add(mk(new THREE.CylinderGeometry(3.1,3.1,2.2,48,1,true),mat(0xfafafa,{op:.35,ds:true}),[0,-1,0]));tuurga.add(mk(new THREE.CylinderGeometry(.8,3.15,1,48,1,true),mat(0xfafafa,{op:.35,ds:true}),[0,.6,0]));
 const zuuh=P('Голомт, зуух','Гэрийн голд байрлах гал голомт — гэр бүлийн өв залгамжлалын бэлгэдэл. Гал руу хог хаяхгүй, ус асгахгүй.',[0,.1,0],[0,.4,0]);zuuh.add(mk(rbox(.8,.7,.8,.06),mat(0x343a40,{m:.7})));zuuh.add(mk(CY(.1,.1,2.6,12),mat(0x495057,{m:.7}),[0,1.6,0]));
}});
lab({id:'state',s:'ie',g:[9,10,11,12],u:'Төр, иргэн',name:'Төрийн гурван салаа',desc:'Хууль тогтоох, гүйцэтгэх, шүүх эрх мэдэл; Үндсэн хууль.',zoom:13,build(P){
 const b=P('Ард түмэн','Монгол Улсад төрийн бүх эрх ард түмний мэдэлд байна (Үндсэн хууль).',[0,-.6,0],[0,-.6,0]);b.add(mk(rbox(7,.4,3.6,.06),mat(0xe9edf5)));for(let i=0;i<3;i++)b.add(mk(rbox(7.4-i*.2,.15,4-i*.2,.03),mat(0xdfe4ee),[0,-.28-i*.15,0]));
 [['Улсын Их Хурал','Хууль тогтоох эрх мэдэл. 126 гишүүнтэй, хуулиа батална.',0x2f45ff,-2.3],['Засгийн газар','Гүйцэтгэх эрх мэдэл. Хуулийг хэрэгжүүлж, төрийн ажлыг удирдана.',0xff5b3a,0],['Шүүх','Шүүх эрх мэдэл. Маргааныг хуулийн дагуу хараат бусаар шийднэ.',0x00c08b,2.3]].forEach(([n,info,c,x])=>{const g=P(n,info,[x,1.1,0],[x*.3,0,0]);g.add(mk(CY(.55,.65,3,32),mat(c,{r:.35})));g.add(mk(rbox(1.5,.2,1.5,.04),mat(0xffffff),[0,1.6,0]));g.add(mk(rbox(1.5,.2,1.5,.04),mat(0xffffff),[0,-1.6,0]));const s=txtSprite(n);s.position.set(0,2.1,0);g.add(s)});
 const r=P('Үндсэн хууль','Улсын дээд хууль — гурван салааг тэнцвэртэй барина.',[0,3.3,0],[0,1.2,0]);r.add(mk(B(6.4,.25,2.2),mat(0xffffff,{r:.4}),[0,-.2,0]));const sh=new THREE.Shape();sh.moveTo(-3.3,0);sh.lineTo(3.3,0);sh.lineTo(0,1.1);sh.closePath();const pe=new THREE.ExtrudeGeometry(sh,{depth:2,bevelEnabled:false});pe.translate(0,0,-1);r.add(mk(pe,mat(0xf1f3f5,{r:.4})));
}});

const LORD=['pc_setup','dev_input','dev_output','dev_proc','storage','dev_conn'];const labsFor=(s,g)=>LABS.filter(m=>m.s===s&&m.g.includes(+g)).sort((a,b)=>((LORD.indexOf(a.id)+1)||99)-((LORD.indexOf(b.id)+1)||99));

function build3D(){if(!G3.ok)return;const T=THREE,root=G3.root;while(root.children.length)root.remove(root.children[0]);root.position.set(0,0,0);G3.meshes=[];G3.sel=null;L3.anim=[];L3.parts=[];L3.sprites=[];
 const grid=new T.GridHelper(20,40,0x4b5dff,0x1c2766);grid.position.y=-1.6;grid.material.opacity=.35;grid.material.transparent=true;root.add(grid);
 const M=curLab();G3.zoom=M.zoom||11;G3.rx=M.rx??.38;G3.ry=G3.ry0=M.ry??-.3;
 const P=(name,info,pos,ex,parent)=>{const g=new T.Group();g.position.set(...(pos||[0,0,0]));g.userData={part:1,name,info,base:new T.Vector3(...(pos||[0,0,0])),ex:new T.Vector3(...(ex||[0,0,0]))};(parent||root).add(g);L3.parts.push(g);return g};
 M.build(P);
 L3.parts.forEach(g=>{g.traverse(o=>{if(o.isMesh){o.userData.owner=g;G3.meshes.push(o)}});if(g.children.some(o=>o.isSprite))return;const bb=new T.Box3().setFromObject(g);if(bb.isEmpty())return;const s=txtSprite(g.userData.name.length>30?g.userData.name.slice(0,29)+'…':g.userData.name);const c=bb.getCenter(new T.Vector3());g.worldToLocal(c.setY(bb.max.y+.35));s.position.copy(c);s.visible=L3.labels&&M.lbl!==false;s.userData.lbl=1;g.add(s);L3.sprites.push(s)});
 info3D(null);parts3D()}
function pick(e){const r=G3.R.domElement.getBoundingClientRect();const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);G3.ray.setFromCamera(v,G3.cam);const hit=G3.ray.intersectObjects(G3.meshes,false).find(h=>h.object.visible);select(hit?hit.object.userData.owner:null)}
function select(g){L3.parts.forEach(p=>p.traverse(o=>{if(o.isMesh&&o.material.emissive){if(o.userData.e0===undefined)o.userData.e0=o.material.emissive.getHex();o.material.emissive.setHex(o.userData.e0)}}));G3.sel=g;
 if(g)g.traverse(o=>{if(o.isMesh&&o.material.emissive)o.material.emissive.setHex(0x3a3a12)});info3D(g);document.querySelectorAll('[data-part]').forEach(b=>b.setAttribute('aria-pressed',L3.parts[+b.dataset.part]===g))}
function info3D(g){const h=G3.host&&G3.host.querySelector('.info3d');if(!h)return;const M=curLab();
 h.innerHTML=g?`<b>${esc(g.userData.name)}</b>${esc(g.userData.info)}`:`<b>${esc(M.name)}</b>${esc(M.desc)} ${M.net?'Топологи сонгоно уу.':'Хэсэг дээр дарж тайлбарыг уншина уу.'}`}
function parts3D(){const el=$('#labParts');if(!el||!G3.ok)return;const seen=new Set();
 el.innerHTML=L3.parts.map((p,i)=>{if(seen.has(p.userData.name))return '';seen.add(p.userData.name);return `<button class="lpart" data-part="${i}" aria-pressed="false"><b>${esc(p.userData.name)}</b><span>${esc(p.userData.info)}</span></button>`}).join('')}
function tick3D(t){L3.ex+=(L3.exT-L3.ex)*.08;L3.parts.forEach(p=>{const u=p.userData;p.position.copy(u.base).addScaledVector(u.ex,L3.ex*1.25)});L3.anim.forEach(f=>f(t))}

 if(!G3.ok){host.innerHTML='<div class="nogl">Энэ төхөөрөмж дээр 3D дүрслэл ажиллахгүй байна. Бусад хэсгийг ашиглах боломжтой.</div>';return}
 host.innerHTML='<div class="info3d"></div><div class="hud"></div>';host.prepend(G3.R.domElement);const M=curLab();
 host.querySelector('.hud').innerHTML=(id==='stageHome'?labsFor(S.subj,S.grade).slice(0,4).map(m=>`<button class="chip" data-lab="${m.id}" aria-pressed="${M.id===m.id}">${esc(m.name)}</button>`).join(''):'')+(M.net?Object.keys(NETS).map(k=>`<button class="chip" data-net="${NETS[k]}" aria-pressed="${G3.net===NETS[k]}">${k}</button>`).join(''):'')+
  `<button class="chip" data-l3="ex" aria-pressed="${L3.exT>0}">Задлах</button><button class="chip" data-l3="lbl" aria-pressed="${L3.labels}">Нэр</button><button class="chip" data-l3="rot" aria-pressed="${G3.auto}">Эргүүлэх</button><button class="chip" data-zoom="-1" aria-label="Ойртуулах">＋</button><button class="chip" data-zoom="1" aria-label="Холдуулах">－</button>`;
 size3D();build3D()}
function vLab(){const L=labsFor(S.subj,S.grade),M=curLab();
 return `<section class="band"><div class="wrap">${head('3D интерактив лаб',`${SUBJ[S.subj]} · ${S.grade}-р анги — сурах бичгийн сэдвээр. Чирж эргүүлнэ, дугуйгаар ойртуулна, хэсэг дээр дарж тайлбар уншина.`)}${picker()}
